name: Claude Code

on:
  # Auto-review every PR when opened or updated
  pull_request:
    types: [opened, synchronize]
  # On-demand: comment "@claude <request>" on any PR or issue
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Automatic review on PR open/update
  pr-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request against the project conventions in CLAUDE.md.
            Check for: bugs, logic errors, ESP-IDF API misuse, LVGL v9 correctness,
            memory safety (heap allocs, stack depth), and FreeRTOS best practices.
            Note anything that could cause a crash or silent failure on the ESP32-C6.

  # On-demand: responds to @claude mentions in comments
  on-demand:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
